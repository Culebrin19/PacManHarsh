<body>

      <li id="logout" style="display: none;"><a href="#" id="logout-link">Logout</a></li>
    </ul>
  </div>

  <div>
    <img src="../img/titol.png" alt="" style="height: 300px; width: 600px;">
    <img src="../img/logo.jpeg" alt="" style="height: 600px; width: 800px;">
  </div>
  <footer id="dadesPersonals"><strong>&#169;2024 Harsh Kumar</strong></footer>
  <script>
    const usuariActual = localStorage.getItem('usuariActual');
    if (usuariActual) {
      document.querySelectorAll('a[href$="login.html"], a[href$="registre.html"]').forEach(el => {
        el.parentElement.style.display = 'none';
        document.getElementById('logout').style.display = 'block';
      });
    }

    document.getElementById('logout-link')?.addEventListener('click', function (e) {
      e.preventDefault();
      
      const token = localStorage.getItem('token');

      fetch('http://localhost/harsh/v1/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
    })
    .then(response => {
        if (response.ok) {
          localStorage.removeItem('token');
          localStorage.removeItem('usuariActual');
          window.location.href = 'index.html';
        } else {
          console.error('Logout failed');
        }
      })
      .catch(error => console.error('Error:', error));
    });
  </script>
