<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="css/normalized.css">
    <link rel="stylesheet" href="css/registre.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<body class="w3-light-grey">
    <div class="menu">

            <li><a href="registre.html">Registre</a></li>
        </ul>
    </div>
    <div class="w3-container w3-display-middle w3-card-4 w3-white" style="width:300px; padding:20px;">
        <h2 class="w3-center">Login</h2>

        <form id="loginForm" class="w3-container">
            <label class="w3-text-grey"><b>Username</b></label>
            <input class="w3-input w3-border w3-margin-bottom" type="text" id="username" name="username" required>

            <label class="w3-text-grey"><b>Password</b></label>
            <input class="w3-input w3-border" type="password" id="password" name="password" required minlength="6">

            <button type="submit" class="w3-button w3-block w3-green w3-margin-top">Log In</button>
        </form>

        <p id="loginResult" class="w3-center w3-margin-top"></p>
    </div>

    <script>

        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('http://localhost/harsh/v1/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('logged', true);
                        window.location.href = "html/home.html";
                    } else {
                        document.getElementById('loginResult').textContent = data.message;
                    }
                })
                .catch(() => {
                    document.getElementById('loginResult').textContent = 'Error';
                });
        });
